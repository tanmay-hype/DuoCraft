services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duocraft}
      POSTGRES_USER: ${POSTGRES_USER:-gift_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gift_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gift_user} -d ${POSTGRES_DB:-duocraft}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      APP_NAME: DuoCraft API
      ENVIRONMENT: development
      DEBUG: "true"

      FRONTEND_ORIGIN: http://localhost:3000

      DATABASE_URL: postgresql+psycopg://gift_user:gift_password@postgres:5432/duocraft

      REDIS_URL: redis://redis:6379/0

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000

    ports:
      - "${FRONTEND_PORT:-3000}:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules: