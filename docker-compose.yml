services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duocraft}
      POSTGRES_USER: ${POSTGRES_USER:-gift_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gift_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gift_user} -d ${POSTGRES_DB:-duocraft}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      APP_NAME: DuoCraft API
      ENVIRONMENT: development
      DEBUG: "true"

      FRONTEND_ORIGIN: http://localhost:3000

      DATABASE_URL: postgresql+psycopg://gift_user:gift_password@postgres:5432/duocraft

      REDIS_URL: redis://redis:6379/0

      S3_BUCKET_NAME: duocraft-dev
      S3_REGION: ap-south-1
      S3_ACCESS_KEY_ID: duocraft
      S3_SECRET_ACCESS_KEY: duocraft-local-secret
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000

      PHOTO_UPLOAD_MAX_BYTES: "10485760"
      PHOTO_UPLOAD_URL_EXPIRY_SECONDS: "900"

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000

    ports:
      - "${FRONTEND_PORT:-3000}:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: duocraft
      MINIO_ROOT_PASSWORD: duocraft-local-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  minio_data: